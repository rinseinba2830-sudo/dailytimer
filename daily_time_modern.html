<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Time</title>
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#151517;
    --panel2:#1b1b1e;
    --text:#f5f5f7;
    --muted:#8e8e93;
    --line:#2a2a2e;
    --accent:#f4d35e;
    --accent2:#9bd1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }
  .app{width:min(720px,100%);margin:0 auto}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin:6px 2px 24px;
  }
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  h1{margin:5px 0 0;font-size:30px;letter-spacing:-.04em}
  .date{font-size:12px;color:var(--muted);padding-bottom:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    border-radius:24px;
    padding:20px;
    min-height:310px;
    display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:0 18px 50px rgba(0,0,0,.22);
  }
  .card::before{
    content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--accent);
  }
  .card.work::before{background:var(--accent2)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .name{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .status{
    font-size:10px;font-weight:700;letter-spacing:.08em;
    color:var(--muted);border:1px solid var(--line);padding:6px 8px;border-radius:999px;
  }
  .status.running{color:var(--text);background:#222228}
  .time{
    font-size:48px;font-weight:750;letter-spacing:-.055em;
    font-variant-numeric:tabular-nums;margin:32px 0 8px;
  }
  .caption{font-size:12px;color:var(--muted)}
  .progress{
    height:7px;background:#26262a;border-radius:999px;overflow:hidden;margin:20px 0 4px;
  }
  .fill{height:100%;width:100%;background:var(--accent);border-radius:999px}
  .work .fill{background:var(--accent2)}
  .buttons{display:grid;grid-template-columns:1.3fr 1fr;gap:9px;margin-top:26px}
  button{
    border:0;border-radius:14px;padding:14px 12px;
    font-size:13px;font-weight:750;
    background:#27272b;color:var(--text);
  }
  button.primary{background:var(--text);color:#0a0a0b}
  button:active{transform:scale(.985)}
  .note{
    margin:16px 4px 0;color:var(--muted);font-size:11px;line-height:1.6;
  }
  @media(max-width:600px){
    h1{font-size:28px}
    .grid{grid-template-columns:1fr}
    .card{min-height:270px}
    .time{font-size:54px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">Daily allowance</div>
      <h1>今日の5時間</h1>
    </div>
    <div class="date" id="today"></div>
  </header>

  <div class="grid">
    <section class="card">
      <div>
        <div class="row">
          <div class="name">自由時間</div>
          <div class="status" id="stateA">停止中</div>
        </div>
        <div class="time" id="timeA">05:00:00</div>
        <div class="caption">今日の残り時間</div>
        <div class="progress"><div class="fill" id="fillA"></div></div>
      </div>
      <div class="buttons">
        <button class="primary" id="startA">開始</button>
        <button id="stopA">停止</button>
      </div>
    </section>

    <section class="card work">
      <div>
        <div class="row">
          <div class="name">作業時間</div>
          <div class="status" id="stateB">停止中</div>
        </div>
        <div class="time" id="timeB">05:00:00</div>
        <div class="caption">今日の残り時間</div>
        <div class="progress"><div class="fill" id="fillB"></div></div>
      </div>
      <div class="buttons">
        <button class="primary" id="startB">開始</button>
        <button id="stopB">停止</button>
      </div>
    </section>
  </div>

  <div class="note">
    開始中だけ残り時間が減ります。停止するとその時点で保存されます。日付が変わると両方とも自動で5時間に戻ります。
  </div>
</div>

<script>
const DAILY = 5 * 60 * 60 * 1000;
const KEY = "daily5hTimers_v2";

function dateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmt(ms){
  ms=Math.max(0,ms);
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return [h,m,sec].map(v=>String(v).padStart(2,"0")).join(":");
}
function fresh(){
  return {date:dateKey(),A:{remaining:DAILY,running:false,last:null},B:{remaining:DAILY,running:false,last:null}};
}
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!d || d.date!==dateKey()) d=fresh();
  return d;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
let data=load();

function rollover(){
  if(data.date!==dateKey()){data=fresh();save()}
}
function sync(k){
  const t=data[k];
  if(t.running && t.last){
    const now=Date.now();
    t.remaining=Math.max(0,t.remaining-(now-t.last));
    t.last=now;
    if(t.remaining<=0){t.running=false;t.last=null}
  }
}
function render(){
  rollover();sync("A");sync("B");
  for(const k of ["A","B"]){
    const t=data[k];
    document.getElementById("time"+k).textContent=fmt(t.remaining);
    document.getElementById("fill"+k).style.width=((t.remaining/DAILY)*100)+"%";
    const s=document.getElementById("state"+k);
    s.textContent=t.running?"計測中":"停止中";
    s.classList.toggle("running",t.running);
  }
  document.getElementById("today").textContent=
    new Date().toLocaleDateString("ja-JP",{month:"2-digit",day:"2-digit",weekday:"short"});
  save();
}
function start(k){
  rollover();sync(k);
  if(data[k].remaining<=0)return;
  data[k].running=true;data[k].last=Date.now();save();render();
}
function stop(k){
  rollover();sync(k);
  data[k].running=false;data[k].last=null;save();render();
}
for(const k of ["A","B"]){
  document.getElementById("start"+k).onclick=()=>start(k);
  document.getElementById("stop"+k).onclick=()=>stop(k);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){sync("A");sync("B");save()}else render();
});
window.addEventListener("beforeunload",()=>{sync("A");sync("B");save()});
setInterval(render,250);
render();
</script>
</body>
</html>
